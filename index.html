<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Native Data Foundation</title>
<meta name="description" content="AI-Native Data Foundation. Coming soon.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{--substrate:#0C1D2B;--bone:#F4EFE4;--graphite-light:#7A8794;--live:#22C2B4}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--substrate);color:var(--bone);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:2rem}
  main{max-width:40rem;text-align:left}
  .plate{display:inline-block;background:var(--bone);padding:16px;margin-bottom:2rem}
  .plate svg{display:block;width:120px;height:auto}
  h1{font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:clamp(1.75rem,5vw,2.75rem);line-height:1.1;letter-spacing:-.01em}
  .eyebrow{font-family:Archivo,system-ui,sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.11em;text-transform:uppercase;color:var(--live);margin-bottom:.75rem}
  p.soon{margin-top:1.25rem;color:var(--graphite-light);font-size:1.05rem}
</style>
</head>
<body>
<main>
  <div class="plate" role="img" aria-label="AINDF mark: five vertical bars running cold to hot, from deep blue through teal and amber to red-orange, resting on a heavy reference line with a small caret under the centre bar">
    <svg viewBox="0 0 120 84" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="6"  y="6" width="16" height="54" fill="#0C3340"/>
      <rect x="28" y="6" width="16" height="54" fill="#0E8F9E"/>
      <rect x="50" y="6" width="16" height="54" fill="#22C2B4"/>
      <rect x="72" y="6" width="16" height="54" fill="#F2A93B"/>
      <rect x="94" y="6" width="16" height="54" fill="#E4502E"/>
      <rect x="0" y="60" width="116" height="8" fill="#0C1D2B"/>
      <polygon points="58,70 51,80 65,80" fill="#0C1D2B"/>
    </svg>
  </div>
  <div class="eyebrow">AINDF</div>
  <h1>AI-Native Data Foundation</h1>
  <p class="soon">Coming soon.</p>
</main>
</body>
</html>
